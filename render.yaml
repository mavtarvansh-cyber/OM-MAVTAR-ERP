services:
  - type: web
    name: om-mavtar-erp
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
    disk:
      name: erp-data
      mountPath: /var/data
      sizeGB: 1
